name: Scheduled analysis
on:
  schedule:
    - cron: '0 07 * * *' # Sets Semgrep to scan every day at 07:00 UTC
permissions:
  security-events: write
jobs:
  semgrep:
    uses: digicatapult/shared-workflows/.github/workflows/scan-vulns.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    permissions:
      security-events: write
    with:
      enable_semgrep_action: true
      extra_args: '--config="p/default"'
      sarif_path: semgrep.sarif
