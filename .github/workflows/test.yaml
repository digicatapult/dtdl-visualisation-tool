name: Lint and Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-checks:
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-npm.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    permissions:
      contents: read
    with:
      migrations_dir: src/lib/db/migrations
      postgres_image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
      db_name: dtdl-visualisation-tool

  static-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    permissions:
      security-events: write
    with:
      matrix_commands: '["lint", "depcheck", "check", "xss-scan"]'
      enable_semgrep_action: true
      enable_trufflehog_action: true
      semgrep_extra_args: '--config="p/default"'
      semgrep_upload_type: 'sarif'
      trufflehog_extra_args: '--results=verified,unknown --log-level=2'
      node_version: '24.22.1'

  tests-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-npm.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    permissions:
      pull-requests: write
    with:
      docker_compose_file: ''
      npm_build_command: 'npm run build'
      tests: '["test:unit", "test:integration", "test:ratelimit"]'
      coverage_config_json: '.c8rc.json'
      node_version: '24.22.1'
      env_vars: |
        {
          "TMPDIR": "${{ github.workspace }}",
          "PUPPETEER_ARGS": "--no-sandbox,--disable-setuid-sandbox"
        }

  e2e-tests-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-e2e-npm.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    permissions: {}
    with:
      docker_compose_file: ''
      node_version: '24.22.1'
      pre_test_command: 'npm ci && npx playwright install-deps && npx playwright install'
      test_command: 'npm run test:playwright || exit 1'
      env_vars: |
        {
          "PUPPETEER_ARGS": "--no-sandbox,--disable-setuid-sandbox"
        }
    secrets: inherit

  build-docker:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@5f09f5d6707e0c4fc42f7187885b6a1ee83d8433 # main
    with:
      scan_container: true
      scan_fail_severity: 'HIGH,CRITICAL'
    permissions:
      contents: read
      packages: write
      security-events: write
